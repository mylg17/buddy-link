name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check b/bridge.mjs
          node --check a/remote-buddy.mjs
          node --check tools/buddy
      - name: End-to-end (fake CLI)
        run: node test/e2e.mjs
